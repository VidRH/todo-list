<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>todolisttypescripttodoinclass</title>

  <body>
    <div id="app"></div>
    <div class="container">
      <h1>todo app</h1>
      <form class="todo-form">
        <input type="text" placeholder="add a new todos" id="todo-input" class="todo-input">
        <input type="date" placeholder="Due date" id="date-input" class="date-input">
        <button type="submit" id="todo-button">Add</button>
      </form>
      <p id="error-message">please enter a todo item or name of whatever</p>

      <ul class="todo-list" id="todo-list">

      </ul>
